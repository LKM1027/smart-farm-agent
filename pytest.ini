[pytest]
# 테스트 디렉토리 루트
testpaths = tests

# asyncio 모드 설정 (pytest-asyncio)
asyncio_mode = auto

# 테스트 출력 상세도
addopts =
    -v
    --tb=short
    --no-header

# 수집 대상 파일/클래스/함수 패턴
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 마커 등록 (경고 방지)
markers =
    unit: 단위 테스트 — 외부 I/O 없음 (LLM, DB, API 호출 없음)
    integration: 통합 테스트 — 실제 서버 기동 필요
    hardware: KS 표준 하드웨어 제어 안전 가드레일 테스트 (절대 실패 금지)
